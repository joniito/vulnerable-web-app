name: Redshift Grants

# ─────────────────────────────────────────────────────────────────────────────
# Triggers
# ─────────────────────────────────────────────────────────────────────────────
on:
  # Ejecución manual con selección de ambiente
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
      dry_run:
        description: "Dry-run: valida el SQL sin ejecutarlo en Redshift"
        required: false
        type: boolean
        default: false

  # Auto-ejecución al mergear cambios en los grants
  push:
    branches:
      - master
    paths:
      - "sql/grants/**.sql"

# ─────────────────────────────────────────────────────────────────────────────
# Permisos mínimos (principio de least privilege)
# ─────────────────────────────────────────────────────────────────────────────
permissions:
  id-token: write   # Necesario para OIDC con AWS
  contents: read

# ─────────────────────────────────────────────────────────────────────────────
# Variables globales
# ─────────────────────────────────────────────────────────────────────────────
env:
  AWS_REGION: us-east-1
  POLL_INTERVAL_SECONDS: 5
  POLL_MAX_ATTEMPTS: 60   # 5 min máximo de espera

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Job 1: Detectar el ambiente objetivo
  # En push automático aplica a dev; en manual respeta el input.
  # ───────────────────────────────────────────────────────────────────────────
  resolve-environment:
    name: Resolve target environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.resolve.outputs.environment }}
      sql_file:    ${{ steps.resolve.outputs.sql_file }}
      dry_run:     ${{ steps.resolve.outputs.dry_run }}
    steps:
      - name: Resolve environment and SQL file
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENV="${{ github.event.inputs.environment }}"
            DRY_RUN="${{ github.event.inputs.dry_run }}"
          else
            # Push automático: aplica grants de dev por defecto
            ENV="dev"
            DRY_RUN="false"
          fi

          SQL_FILE="sql/grants/grants_${ENV}.sql"

          echo "environment=${ENV}"  >> "$GITHUB_OUTPUT"
          echo "sql_file=${SQL_FILE}" >> "$GITHUB_OUTPUT"
          echo "dry_run=${DRY_RUN}"  >> "$GITHUB_OUTPUT"

          echo "### Resolved config" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Environment:** \`${ENV}\`"   >> "$GITHUB_STEP_SUMMARY"
          echo "- **SQL file:** \`${SQL_FILE}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Dry-run:** \`${DRY_RUN}\`"  >> "$GITHUB_STEP_SUMMARY"

  # ───────────────────────────────────────────────────────────────────────────
  # Job 2: Validar sintaxis SQL antes de tocar Redshift
  # ───────────────────────────────────────────────────────────────────────────
  validate-sql:
    name: Validate SQL syntax
    runs-on: ubuntu-latest
    needs: resolve-environment
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install sqlfluff
        run: pip install sqlfluff --quiet

      - name: Lint SQL file
        run: |
          SQL_FILE="${{ needs.resolve-environment.outputs.sql_file }}"
          echo "Validating: ${SQL_FILE}"
          sqlfluff lint "${SQL_FILE}" \
            --dialect redshift \
            --rules LT01,LT02,LT09,RF01,RF02,RF03,AM01 \
            --nocolor || true
          # --nocolor + || true: lint no bloquea el pipeline, solo reporta.
          # Quita el "|| true" si quieres hacer el lint bloqueante.

      - name: Check file exists and is non-empty
        run: |
          SQL_FILE="${{ needs.resolve-environment.outputs.sql_file }}"
          if [ ! -s "${SQL_FILE}" ]; then
            echo "::error::SQL file '${SQL_FILE}' not found or is empty."
            exit 1
          fi
          LINES=$(wc -l < "${SQL_FILE}")
          echo "SQL file has ${LINES} lines — OK"

  # ───────────────────────────────────────────────────────────────────────────
  # Job 3: Aplicar grants en el ambiente destino
  # Para prod se exige aprobación manual (configura GitHub Environment "prod"
  # con Required Reviewers en Settings → Environments).
  # ───────────────────────────────────────────────────────────────────────────
  apply-grants:
    name: Apply grants (${{ needs.resolve-environment.outputs.environment }})
    runs-on: ubuntu-latest
    needs:
      - resolve-environment
      - validate-sql
    # Referencia al GitHub Environment para poder aplicar protection rules
    environment: ${{ needs.resolve-environment.outputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Autenticación AWS vía OIDC (sin credenciales de larga duración) ──
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets[format('AWS_ROLE_ARN_{0}', upper(needs.resolve-environment.outputs.environment))] }}
          aws-region: ${{ env.AWS_REGION }}
          # OIDC evita guardar Access Key / Secret Key como secretos.
          # Configura el trust policy del rol IAM apuntando a este repo y rama.

      # ── Leer parámetros de conexión desde SSM Parameter Store ──
      - name: Fetch Redshift connection params from SSM
        id: ssm
        run: |
          ENV="${{ needs.resolve-environment.outputs.environment }}"
          PREFIX="/redshift/${ENV}"

          CLUSTER_ID=$(aws ssm get-parameter \
            --name "${PREFIX}/cluster-identifier" \
            --query "Parameter.Value" --output text)

          DATABASE=$(aws ssm get-parameter \
            --name "${PREFIX}/database" \
            --query "Parameter.Value" --output text)

          DB_USER=$(aws ssm get-parameter \
            --name "${PREFIX}/admin-user" \
            --with-decryption \
            --query "Parameter.Value" --output text)

          # Exportar de forma segura (masked en logs)
          echo "cluster_id=${CLUSTER_ID}" >> "$GITHUB_OUTPUT"
          echo "database=${DATABASE}"     >> "$GITHUB_OUTPUT"
          echo "db_user=${DB_USER}"       >> "$GITHUB_OUTPUT"

          # Maskear valores sensibles
          echo "::add-mask::${DB_USER}"

      # ── Dry-run: mostrar el SQL sin ejecutarlo ──
      - name: "[DRY-RUN] Print SQL to be executed"
        if: needs.resolve-environment.outputs.dry_run == 'true'
        run: |
          echo "### SQL to be applied (DRY-RUN)" >> "$GITHUB_STEP_SUMMARY"
          echo '```sql' >> "$GITHUB_STEP_SUMMARY"
          cat "${{ needs.resolve-environment.outputs.sql_file }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Dry-run complete. No changes applied."

      # ── Ejecutar grants vía Redshift Data API ──
      # La Data API no requiere conectividad directa al cluster (sin VPN/SG).
      # Soporta clusters Redshift Provisioned y Redshift Serverless.
      - name: Execute grants via Redshift Data API
        if: needs.resolve-environment.outputs.dry_run != 'true'
        id: execute
        run: |
          SQL_FILE="${{ needs.resolve-environment.outputs.sql_file }}"
          CLUSTER_ID="${{ steps.ssm.outputs.cluster_id }}"
          DATABASE="${{ steps.ssm.outputs.database }}"
          DB_USER="${{ steps.ssm.outputs.db_user }}"

          echo "Submitting SQL to Redshift Data API..."

          # La Data API acepta el SQL completo como string.
          # Se pasa por archivo para evitar problemas de quoting en bash.
          SQL_CONTENT=$(cat "${SQL_FILE}")

          STATEMENT_ID=$(aws redshift-data execute-statement \
            --cluster-identifier "${CLUSTER_ID}" \
            --database "${DATABASE}" \
            --db-user "${DB_USER}" \
            --sql "${SQL_CONTENT}" \
            --query "Id" \
            --output text)

          echo "Statement ID: ${STATEMENT_ID}"
          echo "statement_id=${STATEMENT_ID}" >> "$GITHUB_OUTPUT"

      # ── Polling: esperar resultado de la ejecución ──
      - name: Poll execution status
        if: needs.resolve-environment.outputs.dry_run != 'true'
        run: |
          STATEMENT_ID="${{ steps.execute.outputs.statement_id }}"
          MAX_ATTEMPTS=${{ env.POLL_MAX_ATTEMPTS }}
          INTERVAL=${{ env.POLL_INTERVAL_SECONDS }}
          ATTEMPT=0

          echo "Polling statement ${STATEMENT_ID}..."

          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            ATTEMPT=$((ATTEMPT + 1))

            RESPONSE=$(aws redshift-data describe-statement \
              --id "${STATEMENT_ID}" \
              --output json)

            STATUS=$(echo "${RESPONSE}" | jq -r '.Status')
            echo "Attempt ${ATTEMPT}/${MAX_ATTEMPTS} — Status: ${STATUS}"

            case "${STATUS}" in
              FINISHED)
                echo "::notice::Grants applied successfully."
                echo "### Grants applied successfully :white_check_mark:" >> "$GITHUB_STEP_SUMMARY"
                exit 0
                ;;
              FAILED|ABORTED)
                ERROR=$(echo "${RESPONSE}" | jq -r '.Error // "Unknown error"')
                echo "::error::Redshift execution failed: ${ERROR}"
                echo "### Execution FAILED :x:" >> "$GITHUB_STEP_SUMMARY"
                echo "**Error:** \`${ERROR}\`"   >> "$GITHUB_STEP_SUMMARY"
                exit 1
                ;;
              PICKED|STARTED|SUBMITTED)
                sleep "${INTERVAL}"
                ;;
              *)
                echo "::warning::Unknown status '${STATUS}'. Continuing..."
                sleep "${INTERVAL}"
                ;;
            esac
          done

          echo "::error::Timed out waiting for Redshift statement to complete."
          exit 1

      # ── Resumen final ──
      - name: Summary
        if: always()
        run: |
          ENV="${{ needs.resolve-environment.outputs.environment }}"
          SQL_FILE="${{ needs.resolve-environment.outputs.sql_file }}"
          DRY_RUN="${{ needs.resolve-environment.outputs.dry_run }}"
          OUTCOME="${{ job.status }}"

          echo "---"                                        >> "$GITHUB_STEP_SUMMARY"
          echo "| Field       | Value               |"     >> "$GITHUB_STEP_SUMMARY"
          echo "|-------------|---------------------|"     >> "$GITHUB_STEP_SUMMARY"
          echo "| Environment | \`${ENV}\`          |"     >> "$GITHUB_STEP_SUMMARY"
          echo "| SQL file    | \`${SQL_FILE}\`     |"     >> "$GITHUB_STEP_SUMMARY"
          echo "| Dry-run     | \`${DRY_RUN}\`      |"     >> "$GITHUB_STEP_SUMMARY"
          echo "| Outcome     | \`${OUTCOME}\`      |"     >> "$GITHUB_STEP_SUMMARY"
          echo "| Triggered by| \`${{ github.actor }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit      | \`${{ github.sha }}\` |"   >> "$GITHUB_STEP_SUMMARY"
